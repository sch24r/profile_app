<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.
    The value is replaced by the `--base-href` argument of `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Marchello Putra Ramadhan — Information Systems undergraduate at ITS · Cyber security, digital forensics &amp; OSINT">
  <meta name="theme-color" content="#2A0E57">
  <meta name="color-scheme" content="light dark">

  <meta property="og:title" content="Marchello Putra Ramadhan">
  <meta property="og:description" content="Information Systems undergraduate at ITS · Cyber security, digital forensics &amp; OSINT">
  <meta property="og:type" content="website">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Marchello">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Marchello Putra Ramadhan</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #2A0E57;
      overflow: hidden;
    }
    /* Static splash (no animation): flat deep violet with a small lilac mark.
       It is cut on Flutter's first frame, where the intro overlay (same
       colour) takes over. */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #2A0E57;
    }
    #splash .mark {
      color: #C9A2FF;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 900;
      font-size: 28px;
      line-height: 0.9;
      letter-spacing: -0.04em;
      user-select: none;
    }
    /* Dark theme: the intro overlay uses the light display colour. */
    html.dark, html.dark body, html.dark #splash { background: #E6D8FF; }
    html.dark #splash .mark { color: #2E1466; }
  </style>
  <script>
    // Match the splash to the theme Flutter will start with
    // (shared_preferences 'theme_mode': 0 system, 1 light, 2 dark).
    (function () {
      try {
        var raw = window.localStorage.getItem('flutter.theme_mode');
        var mode = raw == null ? 0 : parseInt(JSON.parse(raw), 10);
        var dark = mode === 2 ||
          (mode !== 1 && window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) {
          document.documentElement.classList.add('dark');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', '#E6D8FF');
        }
      } catch (e) { /* storage unavailable: keep the light splash */ }
    })();
  </script>
</head>
<body>
  <div id="splash" aria-hidden="true"><div class="mark">MR</div></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (splash) splash.remove();
    }, { once: true });
  </script>
  <!--
    Flutter bootstrap (loads the engine and the app).
    https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
